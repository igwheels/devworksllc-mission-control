    <style>
      /* Self-contained on purpose (DEV-68): this page must render for a
         signed-out visitor, and nothing it references may sit behind the
         auth gate it's asking them to get past — so no external JS/CSS
         bundle, no separate icon request, everything inlined. */
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0b0f14;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Helvetica,
          Arial,
          sans-serif;
        color: #e7e9ee;
      }
      .card {
        width: min(360px, calc(100vw - 48px));
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 28px;
      }
      .brand img {
        height: 30px;
        width: auto;
      }
      .brand-name {
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      .brand-org {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.4);
        font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      }
      label {
        display: block;
        font-size: 10px;
        letter-spacing: 0.08em;
        color: rgba(255, 255, 255, 0.4);
        margin-bottom: 6px;
      }
      .field {
        margin-bottom: 16px;
      }
      input {
        width: 100%;
        padding: 11px 12px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: #121821;
        color: #e7e9ee;
        font-size: 14px;
        font-family: inherit;
      }
      input:focus {
        outline: none;
        border-color: rgba(76, 141, 255, 0.55);
      }
      button {
        width: 100%;
        padding: 12px;
        margin-top: 6px;
        border-radius: 8px;
        border: none;
        background: #4c8dff;
        color: #0b0f14;
        font-size: 14px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      button:hover:not(:disabled) {
        background: #6da0ff;
      }
      .error {
        display: none;
        margin-top: 16px;
        padding: 10px 12px;
        border-radius: 8px;
        background: rgba(229, 72, 77, 0.1);
        border: 1px solid rgba(229, 72, 77, 0.3);
        color: #e5484d;
        font-size: 13px;
      }
    </style>

        <div>
          <div class="brand-name">MISSION CONTROL</div>
          <div class="brand-org">DevWorks LLC</div>
        </div>
      </div>

      <form id="login-form">
        <div class="field">
          <label for="user">USERNAME</label>
          <input id="user" name="user" type="text" autocomplete="username" autocapitalize="off" autocorrect="off" required autofocus />
        </div>
        <div class="field">
          <label for="pass">PASSWORD</label>
          <input id="pass" name="pass" type="password" autocomplete="current-password" required />
        </div>
        <button type="submit" id="submit-btn">Sign in</button>
        <div class="error" id="error"></div>
      </form>
    </div>

    <script>
      const form = document.getElementById('login-form');
      const errorEl = document.getElementById('error');
      const btn = document.getElementById('submit-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorEl.style.display = 'none';
        btn.disabled = true;
        btn.textContent = 'Signing in…';
        try {
          const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({
              user: form.user.value,
              pass: form.pass.value,
            }),
          });
          if (res.ok) {
            window.location.href = '/';
            return;
          }
          const body = await res.json().catch(() => ({}));
          errorEl.textContent = body.error || 'Sign-in failed.';
          errorEl.style.display = 'block';
        } catch {
          errorEl.textContent = "Can't reach the server. Check your connection and try again.";
          errorEl.style.display = 'block';
        } finally {
          btn.disabled = false;
          btn.textContent = 'Sign in';
        }
      });
    </script>
